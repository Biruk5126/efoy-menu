<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edc18a">
  <meta name="description" content="Efoy Events Coffee Corner fall menu. Scan to view our drinks.">
  <title>Efoy Events Coffee Corner | Menu</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html { background: #edc18a; }
    body { margin: 0; min-height: 100vh; background: #edc18a; font-family: system-ui, sans-serif; }
    main { width: 100%; display: flex; justify-content: center; }
    img { display: block; width: 100%; max-width: 720px; height: auto; object-fit: contain; }
    @media (min-width: 721px) { main { padding: 24px; } img { box-shadow: 0 8px 32px #643b1d24; } }
    @media print { html, body { background: white; } main { padding: 0; } img { max-width: 100%; box-shadow: none; } }
  </style>
</head>
<body>
  <main>
    <img src="menu.png" alt="Efoy Events Coffee Corner autumn menu with six drinks, each priced at $10. Includes iced vanilla latte, iced caramel latte, iced pumpkin spice latte, strawberry lemonade, mint refresher, and strawberry matcha." width="1728" height="2304" fetchpriority="high">
  </main>
</body>
</html>
